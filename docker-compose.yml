version: '3.9'

services:
  mysql:
    image: mysql:8.2
    container_name: liveboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-liveboard}
      MYSQL_USER: ${DB_USER:-liveboard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-liveboardpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - liveboard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liveboard-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-liveboard}
      DB_USER: ${DB_USER:-liveboard}
      DB_PASSWORD: ${DB_PASSWORD:-liveboardpass}
      JWT_SECRET: ${JWT_SECRET:-liveboard-change-this-secret-in-production-min-32-chars}
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
    ports:
      - "8080:8080"
    networks:
      - liveboard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liveboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - liveboard-net

volumes:
  mysql_data:

networks:
  liveboard-net:
    driver: bridge
